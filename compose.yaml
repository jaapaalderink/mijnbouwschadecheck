services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mijnbouw
      POSTGRES_USER: mijnbouw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Stel POSTGRES_PASSWORD in}
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mijnbouw -d mijnbouw"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    command: ["--smtp-disable-rdns"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
